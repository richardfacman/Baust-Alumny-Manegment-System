<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAUST Alumni Admin Dashboard</title>
  <link rel="stylesheet" href="/site/admin-dashboard.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">BA</span>
        <div>
          <strong>BAUST Alumni</strong>
          <small>Admin Console</small>
        </div>
      </div>
      <nav class="nav-list" aria-label="Admin sections">
        <button class="nav-item active" data-view="dashboard"><span>Dashboard</span></button>
        <button class="nav-item" data-view="alumni"><span>Alumni</span></button>
        <button class="nav-item" data-view="events"><span>Events</span></button>
        <button class="nav-item" data-view="news"><span>News</span></button>
        <button class="nav-item" data-view="reports"><span>Reports</span></button>
        <button class="nav-item" data-view="notifications"><span>Notifications</span></button>
        <button class="nav-item" data-view="settings"><span>Settings</span></button>
      </nav>
      <button class="ghost-button sidebar-logout" id="logoutBtn">Logout</button>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <button class="icon-button mobile-only" id="menuBtn" aria-label="Open navigation">☰</button>
        <div>
          <p class="eyebrow">University Alumni Association</p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <div class="search-wrap">
            <input id="globalSearch" type="search" placeholder="Search alumni, events, news" aria-label="Global search">
            <div class="search-results" id="searchResults" hidden></div>
          </div>
          <button class="icon-button" id="notificationBtn" aria-label="Notifications">
            <span>🔔</span><b id="notificationBadge">0</b>
          </button>
          <div class="admin-chip">
            <span>A</span>
            <div><strong>Admin</strong><small>Authenticated</small></div>
          </div>
        </div>
      </header>

      <main class="content">
        <section class="view active" id="dashboardView"></section>
        <section class="view" id="alumniView"></section>
        <section class="view" id="eventsView"></section>
        <section class="view" id="newsView"></section>
        <section class="view" id="reportsView"></section>
        <section class="view" id="notificationsView"></section>
        <section class="view" id="settingsView"></section>
      </main>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <button class="icon-button" id="modalClose" aria-label="Close">×</button>
      </div>
      <div id="modalBody"></div>
    </section>
  </div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script src="/site/admin-dashboard.js"></script>
</body>
</html>
